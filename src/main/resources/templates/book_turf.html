<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Turf</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
        <h2 class="text-2xl font-bold text-center mb-6">Book Your Turf</h2>

        <!-- Date Selection -->
        <div class="mb-6">
            <label for="date" class="block text-gray-700 font-semibold mb-2">Select a Date:</label>
            <input type="date" id="date" name="date"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                onchange="showTimeSlots()">
        </div>

        <!-- Available Time Slots -->
        <div id="time-slots" class="hidden">
            <label class="block text-gray-700 font-semibold mb-2">Available Time Slots:</label>
            <div class="flex flex-wrap gap-2">
                <button class="time-slot-btn bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                    data-time="10:00 to 11:00 am">10:00 to 11:00 AM</button>
                <button class="time-slot-btn bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                    data-time="11:00 to 12:00 pm">11:00 to 12:00 PM</button>
                <button class="time-slot-btn bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                    data-time="12:00 to 01:00 pm">12:00 to 01:00 PM</button>
            </div>
        </div>

        <!-- Proceed Button -->
        <div id="proceed-container" class="hidden mt-6">
            <button id="proceed-btn"
                class="w-full bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600" onclick="proceed()">Proceed</button>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-lg p-6 w-80">
            <h3 class="text-xl font-semibold text-center mb-4">Booking Confirmed</h3>
            <p class="text-center text-gray-700 mb-6" id="confirmation-message"></p>
            <button
                class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        const timeSlots = document.getElementById('time-slots');
        const proceedContainer = document.getElementById('proceed-container');
        const proceedButton = document.getElementById('proceed-btn');
        const modal = document.getElementById('confirmation-modal');
        const confirmationMessage = document.getElementById('confirmation-message');

        function showTimeSlots() {
            // Show time slots when a date is selected
            timeSlots.classList.remove('hidden');
        }

        document.querySelectorAll('.time-slot-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Highlight the selected time slot
                document.querySelectorAll('.time-slot-btn').forEach(slot => slot.classList.remove('bg-blue-600', 'ring', 'ring-blue-400'));
                e.target.classList.add('bg-blue-600', 'ring', 'ring-blue-400');

                // Store the selected time in the proceed button for later use
                proceedButton.dataset.selectedTime = e.target.dataset.time;

                // Show the proceed button
                proceedContainer.classList.remove('hidden');
            });
        });

        function proceed() {
            const selectedDate = document.getElementById('date').value;
            const selectedTime = proceedButton.dataset.selectedTime;

            if (!selectedDate || !selectedTime) {
                alert('Please select a date and time slot before proceeding.');
                return;
            }

            // Generate a random booking ID
            const bookingId = 'TURF-' + Math.random().toString(36).substr(2, 9).toUpperCase();

            // Set confirmation message
            confirmationMessage.textContent = `Your booking for ${selectedDate} at ${selectedTime} has been confirmed. Booking ID: ${bookingId}`;

            // Show the modal
            modal.classList.remove('hidden');
        }

        function closeModal() {
            // Hide the modal
            modal.classList.add('hidden');
        }
    </script>
</body>

</html>
