<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Turf</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
        <h2 class="text-2xl font-bold text-center mb-6">Book Your Turf</h2>

        <!-- Date Selection -->
        <div class="mb-6">
            <label for="date" class="block text-gray-700 font-semibold mb-2">Select a Date:</label>
            <input type="date" id="date" name="date"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                onchange="showTimeSlots()">
        </div>

        <!-- Available Time Slots -->
        <div id="time-slots" class="hidden">
            <label class="block text-gray-700 font-semibold mb-2">Available Time Slots:</label>
            <div class="flex flex-wrap gap-2">
                <!-- Time slots will be dynamically inserted here -->
            </div>
        </div>

        <!-- Proceed Button -->
        <div id="proceed-container" class="hidden mt-6">
            <button id="proceed-btn"
                class="w-full bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600" onclick="proceed()">Proceed</button>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-lg p-6 w-80">
            <h3 class="text-xl font-semibold text-center mb-4">Booking Confirmed</h3>
            <p class="text-center text-gray-700 mb-6" id="confirmation-message"></p>
            <button
                class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        // Function to get query parameters from the URL
        function getQueryParams() {
            const params = {};
            const queryString = window.location.search.substring(1);
            const regex = /([^&=]+)=([^&]*)/g;
            let m;
            while (m = regex.exec(queryString)) {
                params[decodeURIComponent(m[1])] = decodeURIComponent(m[2]);
            }
            return params;
        }

        const timeSlots = document.getElementById('time-slots');
        const proceedContainer = document.getElementById('proceed-container');
        const proceedButton = document.getElementById('proceed-btn');
        const modal = document.getElementById('confirmation-modal');
        const confirmationMessage = document.getElementById('confirmation-message');

        function showTimeSlots() {
            const params = getQueryParams();
            const turfId = params.turf_id;
            const selectedDate = document.getElementById('date').value;

            if (turfId && selectedDate) {
                fetch(`http://localhost:8080/api/slots?turf_id=${encodeURIComponent(turfId)}&date=${encodeURIComponent(selectedDate)}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        const timeSlotContainer = document.querySelector('#time-slots .flex');
                        timeSlotContainer.innerHTML = ''; // Clear existing slots
                        data.forEach(slot => {
                            if (slot.isAvailable) {
                                const startTime = `${slot.start_time.hour.toString().padStart(2, '0')}:${slot.start_time.minute.toString().padStart(2, '0')}`;
                                const endTime = `${slot.end_time.hour.toString().padStart(2, '0')}:${slot.end_time.minute.toString().padStart(2, '0')}`;
                                const btn = document.createElement('button');
                                btn.className = 'time-slot-btn bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600';
                                btn.dataset.time = `${startTime} to ${endTime}`;
                                btn.textContent = `${startTime} to ${endTime}`;
                                timeSlotContainer.appendChild(btn);
                            }
                        });
                        timeSlots.classList.remove('hidden');
                        attachTimeSlotListeners();
                    })
                    .catch(error => console.error('Error fetching time slots:', error));
            }
        }

        function attachTimeSlotListeners() {
            document.querySelectorAll('.time-slot-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.time-slot-btn').forEach(slot => slot.classList.remove('bg-blue-600', 'ring', 'ring-blue-400'));
                    e.target.classList.add('bg-blue-600', 'ring', 'ring-blue-400');
                    proceedButton.dataset.selectedTime = e.target.dataset.time;
                    proceedContainer.classList.remove('hidden');
                });
            });
        }

        function proceed() {
            const params = getQueryParams();
            const turfId = params.turf_id;
            const selectedDate = document.getElementById('date').value;
            const selectedTime = proceedButton.dataset.selectedTime;

            if (!selectedDate || !selectedTime) {
                alert('Please select a date and time slot before proceeding.');
                return;
            }

            const booking = {
                turfId: turfId,
                date: selectedDate,
                time: selectedTime
            };

            fetch('http://localhost:8080/api/bookings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(booking)
            })
            .then(response => response.json())
            .then(data => {
                confirmationMessage.textContent = `Your booking for ${selectedDate} at ${selectedTime} has been confirmed. Booking ID: ${data.id}`;
                modal.classList.remove('hidden');
            })
            .catch(error => console.error('Error creating booking:', error));
        }

        function closeModal() {
            modal.classList.add('hidden');
        }
    </script>
</body>

</html>
