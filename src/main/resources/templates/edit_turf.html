<html>

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <title>Edit Turf</title>
</head>

<body class="bg-green-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Edit Turf</h1>
        <form id="editTurfForm" class="bg-white p-6 rounded shadow-md">
            <div class="mb-4">
                <label for="name" class="block text-gray-700">Name</label>
                <input type="text" id="name" name="name" class="border p-2 w-full" required>
            </div>
            <div class="mb-4">
                <label for="location" class="block text-gray-700">Location</label>
                <input type="text" id="location" name="location" class="border p-2 w-full" required>
            </div>
            <div class="mb-4">
                <label for="pricePerHour" class="block text-gray-700">Price Per Hour</label>
                <input type="number" id="pricePerHour" name="pricePerHour" class="border p-2 w-full" required>
            </div>
            <div class="mb-4">
                <label for="ground_width" class="block text-gray-700">Ground Width</label>
                <input type="number" id="ground_width" name="ground_width" class="border p-2 w-full" required>
            </div>
            <div class="mb-4">
                <label for="ground_length" class="block text-gray-700">Ground Length</label>
                <input type="number" id="ground_length" name="ground_length" class="border p-2 w-full" required>
            </div>
            <div class="mb-4">
                <label for="ground_height" class="block text-gray-700">Ground Height</label>
                <input type="number" id="ground_height" name="ground_height" class="border p-2 w-full" required>
            </div>
            <div class="mb-4">
                <label for="image" class="block text-gray-700">Image URL</label>
                <input type="text" id="image" name="image" class="border p-2 w-full" required>
            </div>
            <button type="submit" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Update</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const turfId = new URLSearchParams(window.location.search).get('turfId');
            fetch(`/api/turfs/${turfId}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('name').value = data.name;
                    document.getElementById('location').value = data.location;
                    document.getElementById('pricePerHour').value = data.pricePerHour;
                    document.getElementById('ground_width').value = data.ground_width;
                    document.getElementById('ground_length').value = data.ground_length;
                    document.getElementById('ground_height').value = data.ground_height;
                    document.getElementById('image').value = data.image;
                });

            document.getElementById('editTurfForm').addEventListener('submit', function(event) {
                event.preventDefault();
                const turf = {
                    turf_id: parseInt(turfId, 10),
                    name: document.getElementById('name').value,
                    location: document.getElementById('location').value,
                    pricePerHour: parseFloat(document.getElementById('pricePerHour').value),
                    ground_width: parseFloat(document.getElementById('ground_width').value),
                    ground_length: parseFloat(document.getElementById('ground_length').value),
                    ground_height: parseFloat(document.getElementById('ground_height').value),
                    image: document.getElementById('image').value
                };

                fetch(`/api/turfs`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(turf)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    alert('Turf updated successfully');
                    window.location.href = '/superadmin';
                })
                .catch(error => {
                    console.error('Error updating turf:', error);
                    alert('Error updating turf: ' + error.message);
                });
            });
        });
    </script>
</body>
</html>
